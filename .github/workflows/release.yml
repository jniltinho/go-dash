# Release on a tag vX.Y.Z: the CI (ci.yml) runs first; then the binaries for linux amd64 and arm64 are built with
# `make dist-bin` (frontend embedded, version from the tag) and published in one release with the gh CLI, with the
# notes of that version in CHANGELOG.md and one checksums.txt. The Docker image of the tag is pushed to
# ghcr.io/jniltinho/go-dash by docker-image-publish.yml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Binary and tarball (binary, install.sh, systemd unit, docs)
        run: |
          set -euo pipefail
          make dist-bin VERSION="${GITHUB_REF_NAME}" GOOS=linux GOARCH=${{ matrix.goarch }}
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
          # the notes: this version's section of CHANGELOG.md
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## )?\[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${TAG}." > notes.md
          cat >> notes.md <<NOTES

          ---
          **Packages:** \`go-dash-${TAG}-linux-{amd64,arm64}.tar.gz\` (static binary with the frontend embedded,
          \`install.sh\`, systemd unit and docs) and \`checksums.txt\`.
          **Docker:** \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}\`
          NOTES
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
